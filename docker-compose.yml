# ============================================================
# docker-compose.yml — Pharma RAG stack
# Usage: docker compose up --build
# ============================================================

services:
  rag-api:
    build: .
    ports:
      - "8000:8000"
    environment:
      LLM_PROVIDER: groq
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      GROQ_API_KEY: ${GROQ_API_KEY}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-20b}
      GROQ_BASE_URL: ${GROQ_BASE_URL:-https://api.groq.com/openai/v1}
      ENTREZ_EMAIL: ${ENTREZ_EMAIL:-your@email.com}
    volumes:
      # Persist HuggingFace model cache across rebuilds
      - hf_cache:/root/.cache/huggingface
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  hf_cache:
